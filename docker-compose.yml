version: '3.8'

services:
  db:
    image: postgres:15
    container_name: exercise_profiling_db
    environment:
      POSTGRES_DB: advpro-2024
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: